services:
  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    container_name: ai-api-litellm
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    command:
      - "--config=/app/config.yaml"
      - "--port=4000"
      - "--num_workers=1"
    env_file:
      - litellm.env
    restart: unless-stopped